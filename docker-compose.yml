version: '3.8'
services:
  lurelit:
    build: .
    ports:
      - "5001:5001"
    environment:
      - CONFIG_SECRET=change-me-to-a-random-string
      # Uncomment and set these to skip the setup wizard:
      # - KIBANA_URL=https://your-kibana-url
      # - WORKFLOW_ID=your-workflow-id
    volumes:
      - lurelit-data:/app/data
    restart: unless-stopped

volumes:
  lurelit-data:
